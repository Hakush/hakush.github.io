<!--1st article(article 1): Foto de Perfil + Titulo(nombre)-->
<article class="section banner">
  <div class="container">
      <div class="section-box-banner">
          <div class="content">
              <div>
                  <!-- <h1>Hola, mi nombre es</h1> -->
                  <h1>Hi, my name is</h1>
              </div>
              <div class='banner-title'>
                  <h2>{{persona.name}}</h2>
                  <h3>{{persona.position}}</h3>
              </div>
              <div class='banner-description'>
                  <p [innerHTML]="persona.about" class="mt-4"></p>
              </div>
          </div>
          <div class="div-btn-banner">
              <a href="mailto:{{persona.email}}" role="button" type="submit" class="btn btn-outline-success" target="_blank">
                  Contact me
              </a>
          </div>
      </div>
  </div>
</article>
