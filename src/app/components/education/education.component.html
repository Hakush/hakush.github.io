<!--4th Article(article 4): Formación -->
<article class="section" id="studies">
    <div class="container jobs">
        <div class="section-box">
            <div class="about-title mb-5" data-aos="fade-up" data-aos-duration="1000">
                <h3 class="e-font section-title">
                    <span class="code-font n-section-title displayFont" style="margin-left: 3%;">Studies</span>
                </h3>
            </div>
            <div class="jobs-tabs" data-aos="fade-up" data-aos-duration="1000">
                <div [ngbNavOutlet]="nav" class="mt-2"></div>
                <ul ngbNav #nav="ngbNav" [(activeId)]="active" class="nav-tabs jobs-tabs">
                    <li *ngFor="let edu of educationList; let i = index" [title]="edu.shortTitle" [ngbNavItem]="i">
                        <a ngbNavLink class="responsive-link"> {{edu.shortTitle}} </a>
                        <ng-template ngbNavContent>
                            <h4 class="title-tab-content">
                                {{edu.titulo}} |
                                <span class="company-tab-content">{{edu.institucion}}</span>
                            </h4>
                            <h5 class="job-time">{{edu.inicio}} - {{edu.fin}}</h5>
                            <p class="job-description">{{edu.descripcion}}</p>
                        </ng-template>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</article>
